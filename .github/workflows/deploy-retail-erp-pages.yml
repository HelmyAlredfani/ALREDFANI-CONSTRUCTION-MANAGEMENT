name: Deploy Retail ERP to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'retail-erp-pages/**'
      - '.github/workflows/deploy-retail-erp-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-retail-erp
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application files
        run: |
          test -s retail-erp-pages/index.html
          test -s retail-erp-pages/assets/app.js
          test -s retail-erp-pages/assets/styles.css
      - name: Check JavaScript syntax
        run: node --check retail-erp-pages/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retail-erp-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
